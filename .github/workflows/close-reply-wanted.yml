name: Close Reply Wanted Issues

# 打了 reply wanted 标签的 issue，若 30 天内没有新消息则自动关闭
# 计时从最后一次打上该标签、最后一条评论、最后一次重新打开中最晚的时间起算
on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 2:00（北京时间 10:00）
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close inactive reply wanted issues
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'reply wanted';
            const DAYS = 30;
            const cutoff = Date.now() - DAYS * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const params = { owner, repo, issue_number: issue.number, per_page: 100 };
              const events = await github.paginate(github.rest.issues.listEvents, params);
              const comments = await github.paginate(github.rest.issues.listComments, params);
              const lastActivity = Math.max(
                Date.parse(issue.created_at),
                ...events
                  .filter(e => (e.event === 'labeled' && e.label?.name === LABEL) || e.event === 'reopened')
                  .map(e => Date.parse(e.created_at)),
                ...comments.map(c => Date.parse(c.created_at)),
              );
              if (lastActivity > cutoff) continue;

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  `该 issue 正在等待回复，但已经 ${DAYS} 天没有新消息，因此自动关闭。如果问题仍然存在，请在此补充所需信息，或新建一个 issue。`,
                  '',
                  `This issue was waiting for a reply but has had no new messages for ${DAYS} days, so it has been closed automatically. If the problem still exists, please add the requested information here or open a new issue.`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned',
              });
              core.info(`Closed #${issue.number} (last activity ${new Date(lastActivity).toISOString()})`);
            }
